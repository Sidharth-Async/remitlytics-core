version: '3.8'

services:
  remitlytics-db:
    image: postgres:16-alpine
    container_name: remitlytics_postgres
    environment:
      POSTGRES_USER: remit_admin
      POSTGRES_PASSWORD: admin_secure_password123
      POSTGRES_DB: remitlytics_ledger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data: